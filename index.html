`Tử Vi|Cha mẹ có địa vị, uy tín; được bề trên nâng đỡ, giấy tờ thuận lợi.|Phúc dày, tính tự tôn; họ hàng có người làm nên.|Dễ có nhà đất giá trị, tổ nghiệp khá; chuộng nơi sang trọng.|Có người giúp việc đắc lực và bạn bè quý nhân; bản thân ở vai trò cầm đầu.|Con cái có tính tự chủ, hiếu thắng; ít con nhưng quý.|Anh chị em có người thành đạt, nể trọng nhau nhưng có người cứng đầu.
Thiên Cơ|Cha mẹ thông minh, hay lo; quan hệ có lúc xa cách, có lúc gần gũi.|Hay suy tư, lo xa; phúc đến nhờ trí tuệ, cần tập thư giãn.|Nhà đất hay thay đổi, di chuyển; có duyên mua bán, đổi chác.|Bạn bè thông minh, nhiều ý kiến nhưng dễ thay đổi, thiếu bền.|Con thông minh, lanh lợi, hơi hay lo; ít con hoặc con đến muộn.|Anh em thông minh nhưng hay mỗi người một hướng.
Thái Dương|Cha có danh, nhiệt tình; quan hệ với cha quan trọng, sáng thì tốt.|Phúc nhờ danh tiếng và sự rộng lượng; mờ thì hay vất vả tinh thần.|Nhà đất hướng sáng; sáng thì có đất đai, mờ thì khó giữ.|Bạn bè nhiều, hay giúp người nhưng dễ bị lợi dụng.|Con cái tính nóng, nhiệt tình; con trai thường có duyên hơn.|Anh em nhiệt tình nhưng hay bận rộn, ít gần gũi.
Vũ Khúc|Cha mẹ thực tế, nghiêm khắc, có tài chính; tình cảm hơi khô khan.|Phúc nhờ tiền bạc và nỗ lực; tinh thần cứng cỏi, ít thư giãn.|Dễ tạo dựng nhà đất bằng tiền tự làm; tích lũy tốt.|Bạn bè thực tế, quan hệ gắn với tiền bạc; cần rõ ràng.|Con cái cứng cỏi, tự lập; ít con hoặc muộn.|Anh em thực tế, có người giỏi tiền; ít thể hiện tình cảm.
Thiên Đồng|Cha mẹ hiền hòa, thương con; quan hệ ấm áp.|Phúc dày, tính hiền, sống an nhàn, thích thanh thản.|Nhà cửa thoải mái; có tổ nghiệp hoặc được hưởng nhờ.|Bạn bè hiền, dễ gần; ít người dưới quyền mạnh mẽ.|Con hiền, dễ thương, khéo; con cái mang niềm vui.|Anh em hòa thuận, tình cảm, nhường nhịn.
Liêm Trinh|Cha mẹ nghiêm khắc, kỷ luật; dễ bất đồng về lối sống.|Tâm tính nhiều đam mê, hay lo; cần kiểm soát tình cảm.|Nhà đất có thể liên quan pháp lý, hoặc mua bán qua tranh chấp.|Bạn bè phức tạp, có người có chức; cần cẩn trọng quan hệ.|Con cái cá tính mạnh, nhạy cảm; cần dạy dỗ kỷ luật.|Anh em cá tính mạnh, hay tranh nhau, có người nổi tiếng.
Thiên Phủ|Cha mẹ có của cải, đức độ; được nuôi dưỡng chu đáo.|Phúc dày, tính độ lượng; đời sống vững vàng.|Rất tốt: có nhà đất, của cải tích lũy, tổ nghiệp bền.|Bạn bè đáng tin, người dưới trung thành, có thể nhờ cậy.|Con cái hiền, khá giả; thường có con ngoan.|Anh em hòa thuận, có chỗ nương tựa, thường khá giả.
Thái Âm|Mẹ hiền, tình cảm, có vai trò lớn; sáng thì mẹ tốt, mờ thì xa cách.|Phúc nhờ tính tình nhẹ nhàng, hay nghĩ nhiều; sáng thì thanh nhàn.|Hợp nhà đất, tài sản tích lũy; có duyên với bất động sản.|Bạn bè nữ giúp đỡ, tinh tế; quan hệ êm ái.|Con gái nhiều, con cái dịu dàng; sáng thì đông con.|Chị em gái tình cảm, giúp đỡ nhau.
Tham Lang|Cha mẹ nhiều quan hệ, đam mê; quan hệ có lúc không gần.|Tinh thần nhiều ham muốn, thích hưởng thụ; cần tiết chế.|Hay đổi nhà, mua bán đất; có thể giàu lên từ bất động sản nhưng không bền.|Bạn bè đông, nhiều quan hệ phức tạp; dễ bị cuốn vào vui chơi.|Con cái đa tài, đào hoa; hay thay đổi.|Anh em nhiều, mỗi người một tính, có người đa tài.
Cự Môn|Cha mẹ hay bất hòa, lời qua tiếng lại; dễ hiểu lầm.|Hay suy nghĩ, nghi ngờ, tinh thần lo lắng; họ hàng có thị phi.|Nhà đất dễ kiện tụng, tranh chấp; cần giấy tờ rõ ràng.|Bạn bè hay thị phi, nói xấu; cần cẩn trọng lời nói.|Con cái hay cãi nhưng khéo ăn nói; nên dạy bằng lý lẽ.|Anh em hay tranh cãi, bất đồng.
Thiên Tướng|Cha mẹ nề nếp, giúp đỡ con; bảo trợ thuận lợi.|Phúc nhờ lễ nghĩa, tinh thần ngay thẳng, được người mến.|Nhà cửa ngăn nắp, nhờ người giúp mà tạo dựng.|Bạn bè trung thành, hay giúp đỡ nhau; hợp hợp tác.|Con cái ngoan, hiểu chuyện, biết lễ phép.|Anh em hỗ trợ nhau, hợp tác tốt.
Thiên Lương|Cha mẹ lớn tuổi hoặc có đức, che chở; được bảo bọc.|Phúc thọ, tâm tính nhân hậu; gặp hung được giải.|Nhà đất lâu bền, thường có tổ nghiệp; không lớn nhưng yên.|Bạn bè lớn tuổi hoặc có đức, che chở; có quý nhân.|Con cái hiền, có đức; con đến muộn hoặc ít.|Anh em hòa nhã, người lớn che chở; có người hơn tuổi giúp.
Thất Sát|Cha mẹ nghiêm, có thể xa cách hoặc khắc khẩu; tình cảm lạnh.|Tâm tính nóng, nhiều biến động; cần học kiên nhẫn.|Nhà đất biến động, đổi chỗ; có duyên kinh doanh bất động sản mạo hiểm.|Bạn bè dũng cảm, mạnh mẽ nhưng dễ xung đột; thuộc hạ khó dạy.|Con cái mạnh mẽ, cá tính cứng; ít con hoặc xa nhau.|Anh em cá tính mạnh, hay xung khắc, mỗi người một ngả.
Phá Quân|Cha mẹ nhiều thay đổi, quan hệ sóng gió, hay xa cách.|Tinh thần bất ổn, nhiều biến động, hay thay đổi quan điểm.|Nhà đất hay bán đi mua lại, khó giữ tổ nghiệp.|Bạn bè hay thay đổi, quan hệ có lúc hợp lúc tan.|Con cái cá tính mạnh, nghịch ngợm; hay khác ý cha mẹ.|Anh em hay bất hòa, mỗi người một hướng, ít gần gũi.`.split('\n').forEach(l=>{const a=l.split('|');MT[a[0]].push(...a.slice(1))});

const LT=Object.fromEntries(`Tử Vi|Là đế tinh nên hay bị lời gièm pha quanh mình và dễ mềm lòng; cần Hóa Quyền, Hóa Khoa hoặc thế bách quan triều củng để hóa giải. Dáng đầy đặn, mặt dài, da đỏ tím hoặc trắng vàng. Tự cao, dễ tin người, bản chất đôn hậu nhưng chịu ngoại cảnh chi phối; thiếu cát tinh thì độc đoán, bướng, hay lang thang; gặp hung tinh thì tự làm mình tổn thương.|Cha mẹ thường có quyền, cha nghiêm và quản thúc nhiều. Không sát tinh thì được che chở, thuở nhỏ sung túc, cha mẹ còn thì của cải còn; gặp Sát, Kỵ, Hình thì thiếu tình thương, gặp Văn Khoa thì được cưng chiều, cha mẹ học vấn cao, khỏe và thọ. Thiếu bách quan triều củng thì cha mẹ bảo thủ như bạo chúa trong nhà.|Tử Vi sáng thì phúc căn dày, thọ, siêng năng, nhiệt tình việc xã hội, được yêu mến nhưng già dặn hơn bạn bè nên dễ thấy cô lập; chỉ chắc khi cả Mệnh và Phúc Đức cùng tốt, gặp sát tinh thì phúc giảm. Nam chí cao khó thực hiện nên khổ tâm; nữ sáng thì thích an nhàn. Có cát tinh thì nhàn, gặp Hình Sát Kỵ thì phải lao động vất vả.|Gia đình khá giả, có tài sản tổ tiên hoặc gia đình, nhưng Tử Vi không phải sao tiền bạc nên của đến rồi đi, thiếu Tả Hữu cuối cùng cũng hao. Nhà cao rộng, địa thế cao, gần cơ quan hoặc nhà giàu. Có duyên và sẵn sức giữ bất động sản; vận hạn gặp Tử Phá hoặc Tử Tướng thì có chuyển dời, gặp sát tinh thì biến động mạnh.|Nhiều hung tinh hội thì làm tự do, làm chủ một mảng, không hợp chính trị, thời nay nên kinh doanh hơn làm quan; có Khoa, Văn, Không đồng cung cũng không nên chọn con đường chính trị. Tử Vi sáng thì làm lãnh đạo cao nhất một tầng lớp; có lục cát thì sự nghiệp tăng tiến, trung niên phát đạt. Tính độc lập cao, dễ tự lập một lĩnh vực.|Bạn bè nhiều người có chức quyền, bản thân phải làm việc quá sức để phục vụ người ngưỡng mộ; làm chủ cũng có cấp dưới sau này thành tựu hơn mình. Sáng thì có trợ thủ, thuộc hạ phẩm cách cao. Cần xét hai góc: bản chất bạn bè, thuộc hạ tốt hay xấu và cách mình đối xử với họ; không ưa thế bách quan triều củng ở cung này.|Ra ngoài được kính trọng; có Tả Hữu thì có quý nhân. Đồng cung Thiên Phủ thì ra ngoài phú quý, đổi chỗ làm mà giàu, nhưng gặp Không Kỵ thì hết thời. Đồng cung Tham Lang được quý nhân nâng, nhiều sát phải lao lực; đồng cung Thiên Tướng phải ly hương mới phát tài; đồng cung Thất Sát không sát tinh thì thực hiện được ước vọng khi đi xa.|Nhiều cát ít hung thì cả đời ít bệnh nặng, có bệnh cũng gặp thầy giỏi. Tử Vi âm thổ nên dễ bệnh tiêu hóa: tức ngực, đầy bụng, nôn, đi ngoài; cũng có thể thấp khí ngoài da. Tử Vi cùng Thiên Tướng gặp sát dễ dị ứng, sỏi thận, mật, bàng quang. Có sát Kỵ thì khó hấp thu dinh dưỡng; có phụ tá thì phải đề phòng ăn uống thừa.|Tài vận khá và thu nhập lớn nhưng không phải kiểu cực giàu: Tử Vi thiên về quyền và danh hơn tiền. Gặp sát và thế Lộc Mã giao trì thì phải rời quê mới kiếm được tiền, hợp kinh doanh nhưng cần đại vận thịnh mới thành doanh nhân giàu. Hội Thiên Đồng, Lộc Tồn, Hóa Lộc thì tích lũy tốt; đồng cung Thiên Phủ cả đời phú quý, nhất là ở Dần, Thân.|Sách nhắc đoán số con theo sao chỉ để tham khảo vì thực tế không chuẩn. Theo quy tắc cổ: đồng cung Thiên Phủ có cát tinh thì 4 đến 5 con, đồng cung Tham Lang khoảng 3, gặp tứ hung, Thiên Hình, Hóa Kỵ thì 1 đến 2. Điều đáng chú ý hơn là tính cách con mạnh, hiếu thắng và quan hệ giữa cha mẹ với con.|Người bạn đời có tính sở hữu cao nhưng có trách nhiệm, hai bên cần thích ứng. Tử Vi đồng Kình Dương thì vợ hoặc chồng lớn tuổi hơn; nữ mệnh cần nhẫn nhịn. Chọn bạn đời kỹ, không nên kết hôn sớm, muộn thì bền; người ấy cương trực, thích thống trị nên dễ bất hòa. Có cát tinh thì bạn đời đẹp, phú quý nhưng dễ đào hoa; đồng cung hoặc hội Thiên Phủ thì sống đến đầu bạc.|Sách cho rằng đoán số anh chị em bằng sao không chính xác, nên chủ yếu dùng cung này xem quan hệ với anh chị em, rộng ra gồm cả bạn thân và người cùng lứa. Theo quy tắc cổ: đồng cung Thiên Phủ khoảng 3 anh em, thêm Tả Hữu Xương Khúc thì 3 đến 5, đồng cung Thiên Tướng 3 đến 4, có lục sát chỉ khoảng 2.
Thiên Cơ|Dáng trung bình, mặt dài gầy hơi nhọn, mắt nhỏ dài, da đẹp; sáng thì đầy đặn, hãm hoặc đồng Cự Môn thì gầy cao, ở Tý Ngọ mập, ở Sửu Mùi gầy yếu. Nhìn xa trông rộng, ôn hòa, lễ phép, thông minh, nhiều mưu lược nhưng nóng tính, hay thay đổi, tình cảm không ổn định.|Nên sống xa cha mẹ kẻo khắc mạnh. Sáng thì cha mẹ hòa nhã, có phúc lộc, ân đức lớn; hãm hoặc gặp lục sát thì xa cách, nhận cha mẹ nuôi hay người ở nhờ lại là điềm lành. Cung này cũng chỉ ông chủ, cấp trên, thầy giáo, nên các mối quan hệ này cũng hay biến động.|Hay suy nghĩ, lo được mất, lao tâm lao lực, ít yên ổn; ham hiểu biết, cầu tiến nhưng hay học thứ không thực tế. Trẻ nỗ lực, già an nhàn. Nhiều cát tinh mà thêm sát tinh thì tuổi thọ và sự an nhàn bị giảm, vì Thiên Cơ chống sát tinh yếu.|Rất khó giữ nghề hoặc nhà cửa; thường phải chuyển nhà, bỏ cả nghề tổ tiên. Sáng và có cát tinh thì trung niên tự có của cải nhưng không bền; thêm tứ sát thì khó tự lập, già mới có của. Nhà hay nằm ven đường, thay đổi theo thời gian.|Sự nghiệp cả đời nhiều thay đổi. Thiên Cơ sáng ở Quan Lộc là quý cách, chức cao quyền lớn; gặp Văn Khúc thì làm quan giỏi; hãm thì chỉ là viên chức nhỏ. Khi vận hạn hoặc lưu niên chạm cung này thì sự nghiệp trong giai đoạn đó biến động mạnh.|Nhiều bạn từ các tầng lớp, nhưng bạn bè hay đổi theo thời gian. Sáng thì được bạn giúp và có cấp dưới giỏi; hãm thì cấp dưới bất hòa, oán trách. Đồng Thái Âm sáng thì được giúp; hãm gặp sát tinh thì bạn nhiều mà không ai giúp được.|Thiên Cơ chủ động và biến đổi nên ra ngoài mới có lợi, ở quê dễ thị phi, phiền muộn; thời nay có thể là đổi việc, đổi ngành. Bạn bè quen biết có người thông minh. Đồng Thái Âm, Lộc Tồn, Hóa Lộc hoặc chiếu về thì phải ra ngoài mới kiếm được tiền.|Chống sát tinh yếu nên dễ bệnh. Chủ suy nghĩ nên thần kinh suy nhược; thuộc Mộc nên dễ bệnh gan mật, can hỏa vượng, mệt mỏi, chóng mặt, ù tai, hoa mắt. Gặp Hỏa Linh thì tay chân và mắt có bệnh; hãm thì đầu mặt dễ bị thương; gặp sát tinh thì cơ thể suy nhược.|Lập nghiệp từ tay trắng, lao tâm lao lực, già mới thành công; tiền đến rồi đi. Gặp ác tinh thì thành công sau biến cố; gặp tứ hung thì kiếm tiền bằng tài khéo. Có cát tinh chiếu thì tài vận vượng; hãm thì tốn tâm lực nhiều thay đổi. Cổ nhân khen thế Cơ Nguyệt đồng cư Tài Bạch có Lộc Tồn, Hóa Lộc là tài phú.|Con ít hoặc đến muộn, người nối dõi thưa thớt (hoặc hôn nhân đổi thay, không lâu dài). Con có kỹ năng đặc biệt, năng động, lanh lợi, xuất sắc; cũng có khả năng có con khác cha hoặc khác mẹ. Đồng Thái Âm nhiều đào hoa lại gặp Tả Hữu thì chuyện tình cảm phức tạp hơn.|Vợ chồng nhiều chuyện, hay cãi vã, bận rộn vì Thiên Cơ chủ việc trong nhà. Bạn đời thường ít tuổi hơn nhưng cá tính mạnh, hoặc chồng lớn tuổi hơn; nên chọn người kém từ 3 tuổi trở lên. Người này thông minh, giỏi quản lý việc nhà; đồng Thái Âm là tướng đào hoa.|Thường anh em xa cách, ít hoặc không có. Sáng thì khoảng 2 anh em, có Cự Môn, Thiên Lương hoặc Thái Âm chiếu cũng vậy; hãm thì bất hòa ý kiến. Gặp Kình Đà Hỏa Linh Hình Mã thì khắc nhau, phân ly. Đồng Thiên Lương ở Thìn Tuất hoặc Sửu Mùi thì trong anh em có người đặc biệt.
Thái Dương|Mặt trái xoan hoặc tròn, mắt nhỏ vừa nhưng cuốn hút, sắc mặt hồng nhuận hoặc đỏ tím; ở Ngọ thì cao lớn, nho nhã; hãm thì da nhợt, vóc trung bình hoặc thấp, hay có nốt ruồi lạ. Ở thế sáng (Dần, Mão, Thìn, Ngọ) không gặp sát tinh thì phát huy trọn tính cách rộng rãi, nhiệt tình, danh tiếng; hãm thì vất vả, ơn nhiều mà ít được đáp.|Sáng thì cha mẹ có phúc lộc, nhân hậu, trọng nghĩa, không xung khắc; ở Ngọ có Thiên Lương đối chiếu thì cha mẹ tốt bụng, thọ, được hưởng âm phúc. Đồng cung cát tinh thì thuở nhỏ được yêu thương, cha mẹ nắm quyền, giàu sang. Gặp Hóa Kỵ, Kình Đà thì quan hệ với cha và bề trên có trắc trở.|Phát đạt trong bận rộn. Sáng thì phúc dày, thọ cao; hãm gặp ác tinh thì phúc giảm, vất vả. Mặt trời luôn chiếu sáng nên người này thích hoạt động, không chịu yên tĩnh. Gặp Kình Dương, Hỏa Tinh thì không việc mà vẫn lao nhọc hoặc bận việc bạn bè; có Tả Hữu thì bận mà được người giúp.|Thái Dương có tính lơ lửng nên sản nghiệp tổ tiên đến rồi đi, dù sáng và có cát tinh cũng khó tránh biến động. Đồng cung Cự Môn ở Dần, Thân có cát tinh, không tứ sát, Không Kiếp thì tài sản tăng nhưng dễ tranh chấp vì của cải. Nơi ở hướng sáng, hay chuyển đổi.|Nhiều cát tinh thì sự nghiệp phát triển lớn, danh tiếng hiển hách; có hung tinh thì sự nghiệp trống rỗng, phất phơ, thể hiện rõ nhất khi Thái Dương ở Ngọ. Sáng thì quan văn hay quan võ đều có địa vị cao. Hợp công việc công khai, được nhiều người biết đến.|Thái Dương không hợp ở cung này: dù không gặp sát, Kỵ cũng ít tác dụng; gặp sát, Kỵ thì ban ơn cũng thành vô ích, làm ơn mắc oán như mặt trời vừa bị trách quá nóng vừa bị trách khi khuất mây. Không nên dấn vào chính trị. Chỉ khi sáng hoặc đồng Thái Âm thì nhiều bạn, và phải có cát tinh hội thì bạn bè mới thật sự giúp được; hãm gặp tứ sát, Không, Kiếp thì lấy ân báo oán.|Chủ động, hướng ngoại nên không hợp giữ im lặng; ra ngoài dễ gần gũi nhưng tốn kém. Hãm thì ra ngoài rất bận rộn; hóa Kỵ thì ra ngoài không lợi, dễ bệnh hoặc nhiều việc. Ra ngoài gặp phúc và quý nhân; có lợi cho người cầu quý, cầu danh hơn người cầu tiền.|Dễ mắc chứng đầu lúc nóng lúc lạnh, huyết áp cao, xuất huyết não, mắt mờ hoặc đỏ, can dương thượng, đau đầu, táo bón, đi ngoài ra máu, tâm hỏa nặng. Sáng thì thể trạng khỏe, gặp họa được cứu; hãm gặp Kình Đà thì bệnh mắt, cận loạn thị, mắt mờ, dễ trúng phong.|Thích khoe giàu nhưng không biết tiết kiệm, ít dư tiền. Sáng và sinh ban ngày thì tiền nhiều, sẵn lòng làm việc thiện; hãm thì cả đời chăm chỉ tích góp, gặp ác tinh thì không đẹp. Dù sáng hay hãm, có cát tinh hay không, người này vẫn khó tích lũy lâu dài.|Con cái hoạt bát, cởi mở, sáng sủa, hào phóng; về già có quý tử, vợ chồng mỹ mãn. Thái Dương ở sáu cung dương (Tý, Dần, Thìn, Ngọ, Thân, Tuất) thì sinh con trai trước. Đồng Thái Âm ở Mùi thì con đông; đồng Cự Môn thì con thông minh, có tài hùng biện, đầu óc kinh doanh; hãm thì xung khắc, bất lợi.|Nam mệnh thì vợ thẳng thắn, trọng nghĩa khí, nóng nảy, có chí; sáng thì vợ khôn ngoan, tốt bụng. Nên kết hôn muộn, kết hôn sớm dễ xung khắc; được bạn đời giúp thì địa vị nâng cao. Sáng gặp cát tinh thì vợ đảm đang, nam mệnh quý vợ mà thành đạt.|Đồng Thái Âm có thể có 5 anh em, tình cảm sâu đậm, giúp nhau; hãm thì ít hòa thuận. Ở Sửu thì không hợp chị em gái, ở Mùi thì không hợp anh em trai. Đồng Cự Môn không sát tinh thì khoảng 3 anh em nhưng tình cảm không sâu, có người hay phàn nàn; có cát tinh thì anh em giúp nhau.
Vũ Khúc|Sắc mặt trắng xanh hoặc xanh đen, mặt vuông tròn trên hẹp dưới vuông, thấp đậm, giọng lớn sáng. Tính cương trực, ngay thẳng, lương thiện, quyết đoán, dũng cảm, trung thành, làm việc dứt khoát, không có ý đồ xấu; các tổ hợp Vũ Tham, Vũ Phá, Vũ Sát, Vũ Phủ, Vũ Tướng cùng nhập Mệnh đều mang nét mặt này.|Tính cô đơn của Vũ Khúc khiến quan hệ với cha mẹ ít thuận, duyên mỏng, dễ xung khắc. Sáng và có cát tinh thì tránh được nếu cha mẹ chiều con hoặc sống xa nhau; nếu thuở nhỏ gia sản tổ tiên bị phá hay cạn thì cũng tránh được xung khắc. Cha mẹ thường cố chấp, bảo thủ.|Vũ Khúc là tài tinh nên có thể hưởng phúc nhưng phải có cát tinh và chỉ ở thế sáng mới hợp cách. Hạnh phúc thiên về hưởng thụ vật chất, thiếu nét thanh nhã; tính nóng, cố chấp, bảo thủ. Hãm thì phúc mỏng, lao tâm lao lực; bị Liêm Trinh khắc chế cũng làm phúc phần kém.|Là cát tinh ở cung này. Sáng thì nhận được tài sản lớn của tổ tiên; hãm thì phải rời tổ rồi mới thành mà cũng khó thành. Muốn thành cách tiền tài thật sự thì trong cung phải có tài tinh đồng hội, khi đó kinh tế phát triển, giữ gìn và phục hồi tốt. Đồng Thiên Phủ thì càng vững.|Hợp nhất vị trí quân sự, nhưng làm kinh doanh cũng thịnh. Đồng Thiên Phủ sáng có cát tinh thì phú quý; thêm Không Kiếp thì chức vụ chỉ bình thường. Đồng Tham Lang không sát tinh thì rất đẹp nhưng dễ thành quan tham mà thất bại; thêm sát tinh thì dễ bội bạc, phản trắc.|Thường dễ bán rẻ bạn bè. Sáng thì nhiều thuộc hạ, bạn bè và được giúp; hãm thì nhiều lời oán trách. Bình thường không có nhiều bạn. Đồng Thiên Phủ thì có nhiều cấp dưới, được giúp, làm ăn phát đạt; sáng thêm cát tinh thì giao tiếp rất rộng.|Phải thấy cát tinh tụ về mới cho rằng sự nghiệp nơi xa lạ tốt đẹp; gặp Sát Kỵ thì tranh chấp đúng sai. Vũ Khúc ở Mệnh hoặc Tài Bạch dễ tạo thế làm giàu nơi xa quê, ví dụ đồng Phá Quân hoặc Thất Sát gặp Lộc Mã song hành, nhưng chỉ khi sao ở thế sáng.|Vũ Khúc âm kim, phổi thuộc kim nên chủ bệnh hô hấp. Gặp tứ sát, Không, Kiếp, Hình, Hao thì phải phẫu thuật; hay gặp tai họa, tay chân đầu mặt bị thương. Sáng thì ít tai họa, hãm thì tay chân có bệnh. Ở Tý, Ngọ dễ bệnh gan mật.|Là tài tinh chân chính (Thiên Phủ là kho tiền, Thái Âm thiên về quyền tài sản, kế hoạch tài chính). Sáng và hội Lộc Tồn, Thiên Mã, Hóa Lộc là cách giàu có, tiền nhiều vô kể; thiếu cát tinh thì làm việc rất vất vả, lao nhọc.|Con ít, đời sau nối dõi cũng ít. Nam mệnh thường gặp vợ có hoa mà không quả, hoặc vô sinh, phải có vợ thứ hoặc người ngoài để sinh con; con đến rất muộn, có thể sau 40 tuổi. Con cá tính mạnh. Gặp Hóa Kỵ và tứ sát thì không có con.|Vợ chồng buồn tẻ, thiếu hài hòa, xung khắc và có thể tái hôn. Sáng và kết hôn muộn thì tránh được. Vũ Khúc ở tứ mộ (Thìn Tuất Sửu Mùi) thì vợ chồng hướng nội; ở Sửu, Mùi gặp sát tinh thì bạn đời mất trước.|Quan hệ với anh em không tốt, anh em ít, ít được quan tâm giúp đỡ, mọi việc phải tự dựa vào mình nên dễ thấy cô độc. Ít hòa thuận; năm Nhâm hóa Kỵ càng tệ. Có cát tinh chiếu và sáng thì tránh được; trong anh em có người cục cằn, lầm lì.
Thiên Đồng|Mặt tròn bầu bĩnh, mắt nhỏ một mí, lông mày đẹp, môi dày; trẻ da trắng, già da vàng; sáng thì hơi mập, hãm thì yếu và thấp. Hiền, tốt bụng, ngay thẳng, khiêm tốn, giỏi viết lách, khát vọng lớn, thông minh, học là thành; nhưng thiếu kiên nhẫn, nhiều kế hoạch tham vọng khó thực hiện. Dương thủy hoạt bát nhưng không hướng ngoại, hơi bảo thủ và thụ động.|Có đủ cha mẹ, hiền lành, thương con, chăm sóc chu đáo. Sáng thì không khắc cha mẹ; hãm thì phải hiếu kính cha mẹ. Đồng Thái Âm thì gắn bó sâu với cả cha lẫn mẹ; gặp sát tinh thì xung khắc. Thế Đồng Âm đặc biệt ngại năm Kỷ vì Thái Âm hóa Kỵ.|Là chính tinh của cung Phúc Đức: chủ hưởng thụ tinh thần, đời sống tinh thần phong phú, có thể hưởng phúc cả đời; có Khoa, Văn thì phong cách tao nhã. Rất hợp cung này nhưng người này lười. Sáng thì cuộc sống sung túc, an nhàn.|Là phúc tinh nhưng thường bất lợi ở Điền Trạch vì phúc của tinh thần chứ không phải hưởng thụ vật chất. Công việc nên thuộc trang trí, thẩm mỹ, nghệ thuật thương mại hơn là lợi ích vật chất. Người này có thể tự mua tài sản; thích nhất là đồng cung hoặc đối chiếu với tài tinh.|Hợp ngành hoa mỹ, hưởng thụ. Nên khởi nghiệp từ đầu, phát triển từ nhỏ lên lớn; gặp cát tinh, nhất là Lộc Tồn, thì từ hai bàn tay trắng mà thành, nhưng phải nếm gian khổ trước. Nếu có tài sản thừa kế của tổ tiên thì thuận lợi hơn.|Tình cảm, dễ gần nên kết bạn nhiều lĩnh vực, nhưng phải có sao phò tá và ít sát tinh mới có sự trợ lực. Bạn bè bốn phương; sáng thì cấp dưới và bạn có năng lực, hòa thuận nên thành công; hãm thì không may.|Có quý nhân phù trợ, làm ăn phát đạt, ra ngoài hay di chuyển đều có phúc; nhiều cát tinh càng đẹp. Đồng Thái Âm thì ra ngoài phát triển nhưng bận rộn, bôn ba; sáng thì lập nghiệp được, hãm thì vất vả.|Dương thủy nên chủ bệnh đường thủy: bàng quang, thận, tiết niệu, thoát vị, lậu, trĩ; thế Thiên Phủ cùng Thiên Lương (đồng cung hay đối cung) dễ mắc nhất. Phần lớn là chứng âm hư bất túc. Sáng thì nhẹ hơn.|Thích ở Tài Bạch: tay trắng gây dựng hoặc khởi từ vốn nhỏ, tích tụ muộn; nên kinh doanh ngành hưởng thụ. Hãm thì tiêu tiền, không giữ được của; thêm sát tinh càng khó tích lũy.|Tình cảm mãnh liệt, dễ giao tiếp với con cái, đàn em, cấp dưới nhưng hơi nhu nhược, rụt rè. Đồng hoặc đối Thái Âm, Thiên Lương mà trong cung nhiều Sát, Kỵ, Hình thì con có nguy cơ chậm phát triển; cần xem kỹ đại hạn, lưu niên.|Hôn nhân phần lớn không thuận, nên hoãn kết hôn; nam chọn vợ kém từ 8 tuổi, nữ chọn chồng lớn hơn 8 tuổi, nếu không dễ kết hôn hai lần. Bạn đời hiền, tốt bụng; Thiên Đồng dễ thay đổi tình cảm nên kết hôn muộn mới bền, hoặc đính hôn sớm rồi hủy.|Sách nhắc đoán số anh em chỉ để tham khảo. Sáng thì đông anh chị em (hơn 4 người); hãm thì ít. Điều thực tế hơn là quan hệ tình cảm, giúp đỡ giữa anh em, bạn thân.
Liêm Trinh|Thân hình cường tráng, mắt sáng, lông mày rậm đen, trán cao, miệng rộng, mặt vàng gần vuông nhưng ít gò má hơn Vũ Khúc, da vàng hoặc vàng sạm. Nếu hãm lại gặp tứ sát thì mặt rỗ hoặc tàn nhang, tính bướng, tàn nhẫn, thiếu lễ nghi. Tính cách chính trực nhưng nhiều đam mê, nội tâm phức tạp.|Là ác tinh ở cung này nên dễ xung khắc nặng với cha mẹ, thiếu che chở; quan hệ với cấp trên cũng khó hài hòa. Chỉ khi đồng Thiên Phủ mới hài hòa, đồng Thiên Tướng thì được cha mẹ hoặc cấp trên bảo vệ. Miếu vượng thì rời tổ ra ngoài lập nghiệp.|Sinh ra để lao động chăm chỉ, ít được thư giãn cả thân lẫn tâm, tâm trí hay thay đổi. Gặp cát tinh thì bận rộn mà có phúc, thọ khoảng trên 70. Đắc địa hoặc bình thì bất an; hãm thêm tứ sát thì nghèo khổ, tính hay thay đổi.|Cung Điền Trạch không ưa Liêm Trinh tọa thủ: vì tổ hợp với các sao khác thường chỉ tài sản tổ tiên bị hủy, và khi tự lập thì rắc rối, tranh chấp, đổ vỡ nhiều. Nếu coi cung này là cơ nghiệp rộng hơn nhà đất thì có thể xem theo hướng khác.|Liêm Trinh chủ quan lộc: miếu có cát tinh hội thì phú quý song toàn, giàu và danh giá; ở Dần, Thân thì thế mạnh nhưng không bền; hãm thì công danh mất. Thêm Hỏa, Linh miếu thì về già thịnh vượng. Người xưa luận sự nghiệp coi trọng kinh doanh.|Miếu vượng thì nhiều bạn, giao tiếp rộng, cấp dưới giỏi. Không miếu thì ít người có năng lực, dễ kết bạn xấu hoặc bị cấp dưới lôi kéo gây tổn thất. Hãm thì bị ghen ghét, bán đứng, phản bội, có sát tinh càng nặng; cuối đời mới gặp may.|Liêm Trinh không nên tọa thủ nơi gốc nên ở Thiên Di lại có lợi khi ra ngoài: gặp may, thông đạt, nhiều nhân duyên. Miếu vượng thì quan hệ tốt, gần quý nhân. Không nên an cư tại nhà, nên đi ra ngoài phát triển sẽ đạt kết quả lớn.|Liêm Trinh là âm hỏa nên chủ âm khuy, tâm hỏa nóng nảy; kết hợp sao khác thành các bệnh: can dương thượng thăng, cảm cúm, thiếu máu, mất ngủ, ho ra máu, di tinh, kinh nguyệt không đều, bệnh lậu, bệnh vùng hậu môn.|Tìm tiền trong cạnh tranh và đúng sai, dễ bị kiện tụng, phá sản, bị biển thủ hay trộm cắp, nên không phải sao tốt ở Tài Bạch. Đồng Thiên Tướng có tính ngang ngược, cần Mệnh có Vũ Khúc đối Tham Lang và thích gặp Hỏa Tinh.|Con cái hiếm. Miếu vượng thì quan hệ con cái sâu đậm, hiểu lầm cũng dễ giải; hãm thì xung khắc giữa người này và con cháu. Nên khuyên thế hệ trẻ gần gũi người lớn, bớt xa cách.|Không có lợi cho hôn nhân: tình cảm mạnh, coi trọng đời sống tinh thần nhưng ý chí yếu nên dễ thay đổi. Người xưa thường kết hôn mù quáng nên Liêm Trinh ở Phu Thê khó hạnh phúc; các sao ở Mệnh thường thiên về tình cảm bất ổn.|Anh em ít và không hòa thuận; gặp cát tinh thì không quá 5 người, nếu không thì có anh chị em cùng cha khác mẹ. Ít đối tác, đồng nghiệp; gặp cát tinh thì có sức mạnh, gặp Hình Sát thì bất lực. Miếu vượng khoảng 2 anh em.
Thiên Phủ|Vóc trung bình đến cao, sau 30 tuổi hơi mập đầy đặn, mặt chữ nhật, da trắng xanh khi trẻ, trắng vàng khi già; đồng Liêm Trinh thì da dày ngăm. Bề ngoài hiền hòa, bên trong kiên định, tốt tính, trung thành, thông minh, kiên trì, nhạy cảm, thích nghi và giỏi giải quyết việc.|Được nhiều phúc khí và ân trạch từ cha mẹ tốt bụng, lịch sự. Miếu vượng không sát Kỵ thì đủ cha mẹ từ nhỏ, hai đời hòa thuận, được giúp đỡ. Hãm thêm sát thì xung khắc, có hình khắc với cha mẹ.|Miếu vượng thì phúc lộc song toàn, phú quý cả đời, hưởng thụ đầy đủ; Mệnh và Phúc Đức đều có cát tinh thì thọ trên 85 (chỉ tham khảo). Đắc địa hoặc bình thì trước khó sau dễ; hãm thêm sát thì vất vả.|Miếu vượng thì tổ tông hưng vượng, có thể tăng tài sản, kế thừa nghề của tổ tiên và tự tạo dựng đều tốt. Người này muốn công việc ổn định, không thay đổi môi trường.|Chủ sự nghiệp lớn. Thiên Phủ ở Sửu có cát tinh thì đại quý, cần Lộc Tồn ở Dậu hội chiếu mới hợp cách; văn võ đều giàu. Có Không Kiếp thì dũng cảm, hợp công xưởng, công nghiệp, không tốt cho đầu cơ.|Quan hệ tốt, một lời hô được trăm người giúp, vận trình suôn sẻ; nhưng phải gặp Khôi Việt, Tả Hữu đồng cung mới có bạn tâm giao và thuộc hạ đắc lực, nếu không khó có tri kỷ, cần thận trọng chọn bạn.|Miếu vượng thì ra ngoài gặp may, có quý nhân phù trợ, không bất lợi; có cát tinh củng chiếu thì tuy vất vả nhưng phát đạt. Đồng Vũ Khúc thì giàu có; tùy các sao khác trong cung mà định.|Dương thổ nên dễ bệnh tỳ vị, phù chân, đầy bụng, phù vàng, thủy thũng do thiếu dinh dưỡng (khi Thiên Phủ là kho rỗng). Nhìn chung cả đời khỏe, ít bệnh, lúc nguy được cứu giúp.|Có tài quản và giữ tiền nhưng chưa chắc giàu; phải gặp Lộc Tồn, Hóa Lộc mới kết luận được. Miếu vượng thì của cải dồi dào, ruộng vườn rộng; đắc địa (Mão, Tỵ, Thân, Hợi) thì trước khó sau dễ.|Nhìn chung đông con, quan hệ ấm áp, hòa nhã, ít xung khắc; con linh hoạt, hiền, hiếu thảo. Miếu vượng có thể có 5 con; thêm Thất Sát và Văn Khúc khoảng 2 con; thêm tứ sát thì giảm.|Chú trọng hưởng thụ tinh thần; vợ chồng có năng lực và thương nhau, có thể không khắc sinh tử nhưng đôi khi không sống cùng nhau, dù ly thân vẫn vương vấn. Nam được vợ nể trọng, vợ trẻ, thông minh, đảm đang, giỏi quản tài chính.|Nhiều anh chị em, tình cảm sâu sắc, hòa thuận, có thể tới 5 người nếu không có lục sát. Đồng Vũ Khúc hoặc Liêm Trinh thì có tổn thương giữa anh em; thêm Văn Xương, Văn Khúc thì thêm duyên nghiệp.
Thái Âm|Trước hết xét giờ sinh ban đêm hay ban ngày: sinh ban đêm thì Thái Âm đắc thế, ban ngày thì vượng; ban đêm mà Thái Âm hãm địa thì đa phần khắc mẹ, nam mệnh còn khắc vợ. Tính tình dịu dàng, tinh tế, giàu tình cảm; sáng thì phú quý và tài hoa, hãm thì lận đận và thần kinh nhạy cảm.|Nên gần cửa chùa, nhất là Thái Âm độc tọa, nếu không tuổi nhỏ dễ cô độc, xa cha mẹ hoặc hình khắc với mẹ đẻ. Miếu thì có đủ cha mẹ, không xung khắc; dù gặp sát tinh cũng chỉ giảm duyên với mẹ.|Miếu thì phúc lộc song toàn, hưởng phúc viên mãn, càng tốt nếu Nhật Nguyệt đồng cung; thọ trên 75 (tham khảo). Đời sống tư tưởng lãng mạn, ham học hỏi. Bình thì có vui có buồn; hãm thêm sát tinh thì tâm trạng nặng nề.|Cát tinh ở Điền Trạch: miếu thì nhiều ruộng đất, có thể lập trang trại, trồng cây ăn quả; nhiều cát tinh hay đứng một mình đều tốt. Gần nhà có vườn, đất trũng, mương rãnh; nhà ngăn nắp, ngủ muộn. Hãm thì có lãi có lỗ, tài sản không bền.|Thái Âm chủ phú quý. Miếu, ít sát tinh, có Tả Hữu và Lộc Tồn hội tụ thì làm nên nhờ sự nghiệp và quý nhân hơn kinh doanh thuần túy. Hợp công việc tinh tế, nghệ thuật, tài chính, y tế, công việc ban đêm.|Miếu thì nhiều bạn tốt, trợ thủ đắc lực. Hãm thì tránh làm tổn thương bạn bè, nếu không có âm mưu, bạn có cũng như không. Đồng Thiên Cơ thì kết bạn nhiều cách; đồng Thái Dương thì phong cách mạnh như gió nhưng tình cảm có lúc thất thường.|Thái Âm chủ yên tĩnh, ẩn tàng, không hợp tranh đoạt với người khác. Miếu thì ra ngoài kết giao nhiều, có quý nhân phù trợ và có tiếng nói; nhiều cát tinh hội tụ càng tốt.|Âm thủy nên chủ âm khuy hao tổn: liệt dương, tiêu chảy, đầy bụng, phù chân, thấp khí, tỳ vị, tiểu trường thấp nhiệt. Miếu vượng thì khỏe, ít bệnh; hãm thì dễ bệnh âm phần, nội tiết.|Cần xét sáng hay hãm để định cát hung, dù độc tọa hay đồng cung. Là tài tinh nên rất hợp cung này: miếu hội Tả Hữu, Xương Khúc, Lộc Tồn, Hóa Lộc thì giàu sang phú quý; hãm thì tiền khó giữ.|Miếu vượng thì con cái phú quý; hãm thì con yếu ớt, hãm gặp Sát Kỵ Hình thì hình khắc, nên nhận con nuôi trước. Cổ nhân cho rằng nên sinh con trai trước.|Nam nên lấy vợ ít tuổi, nữ nên lấy chồng lớn tuổi. Đồng Thiên Cơ thêm Xương Khúc thì cả đời nhiều tình, có thể ở với người trước khi cưới; miếu thì cả hai đều tài giỏi, xinh đẹp, nữ có thể lớn tuổi hơn chồng.|Miếu vượng thì khoảng 5 anh em, giúp đỡ nhau; hãm thì khoảng 3 anh em, bất hòa, khó giúp nhau. Đồng Thiên Cơ thì anh trai nhiều mưu mô; đồng Thái Dương không Sát, Hình, Kỵ thì hài hòa tốt đẹp.
Tham Lang|Da trẻ trắng hoặc hơi vàng, già vàng xanh; mặt dài tròn hoặc lộ xương. Miếu vượng thì cường tráng béo tốt, hãm thì gầy nhỏ, giọng lớn. Bản chất mạnh mẽ, nhìn xa, tính vô thường, đầu óc tính toán, nhiều ham muốn (rượu, tình dục, cờ bạc), phong lưu tùy tiện, hay tự chuốc thất bại.|Quan hệ hai thế hệ hài hòa nhưng người này hay tư lợi. Tham Lang miếu gặp cát tinh mới không khắc, nếu không thì nên xa cha mẹ hoặc được người khác nuôi.|Bận rộn bôn ba; gặp sát thì không việc gì vẫn vất vả ngược xuôi và coi đó là vui. Hóa Kỵ (can Quý) thì nhiều phiền não, bôn ba vẫn thất bại. Miếu có tam cát hóa thì thích vui vẻ, hưởng thụ.|Của cải dễ tán ít tụ. Miếu vượng dù có tổ nghiệp cũng không an phận, trung niên mới có chỗ đứng; hãm thì thoái tổ, nghèo khó, không nghề. Hóa Kỵ (can Quý) thì càng khó giữ.|Chủ việc đối ngoại: hợp quan hệ công chúng, marketing, giải trí, ngoại giao, lập doanh nghiệp giải trí; nên kinh doanh các ngành cần giao tiếp, hợp nghề có yếu tố nghệ thuật.|Miếu vượng thì có người giúp. Hãm thì cấp dưới và bạn bè không tốt bụng, hay tranh cãi, mệt mỏi. Có cát tinh phò tá thì nhiều bạn và thuộc hạ, nhưng vẫn cần chọn người.|Tham Lang là cát diệu về thơ ca, rượu nhạc, giải trí: có cát tinh thì ra ngoài vui vẻ, nhiều bạn cùng sở thích (bài bạc, rượu, tôn giáo...), nên chọn bạn cẩn thận theo sở thích của mình.|Miếu vượng thì ít tai họa; hãm thì bệnh tật theo đuổi. Dương mộc nên bệnh gan mật, can vị bất hòa, chóng mặt, mề đay, co giật (phong), rối loạn nội tiết.|Miếu gặp Lộc Tồn, Hóa Lộc thì cuối cùng giàu có. Đồng Vũ Khúc thì không nên có Lộc Tồn đồng cung mà chỉ hội chiếu; đồng Liêm Trinh mà có Lộc Tồn thì không tốt. Tam phương hội Tử Vi, Thất Sát thì thế càng mạnh nhưng nhiều biến động.|Gặp sao đào hoa thì cổ nhân cho chính thất vô tử, con đến từ vợ lẽ và thường là con gái. Miếu vượng có thể 2-3 con; hãm thì ít, mâu thuẫn với con rể, có con trai là may mắn.|Cả nam và nữ đều không ưa Tham Lang ở Phu Thê: gặp sát hoặc đào hoa thì dễ ngoại tình (nữ thì chồng; nam thì tự có tình riêng). Chỉ khi có Thiên Hình và Không, Diêu đồng cung hôn nhân mới có thể mỹ mãn.|Ít anh em, ít cơ hội giúp nhau. Miếu vượng thì 2-3 anh em, tốt cả với bạn bè và cấp dưới. Hãm thì có anh em cùng cha khác mẹ, như người xa lạ vì ai cũng tự cho mình là trung tâm.
Cự Môn|Mặt chữ nhật hoặc tròn dài, hầu hết mắt một mí và nhỏ; da trẻ trắng xanh, già xanh đen; miếu thì cao gầy, hãm thì thấp nhỏ. Thị lực nhạy, giỏi quan sát lời nói và biểu cảm, phản ứng nhanh, trung thành, tuấn tú; nhưng hay nghi ngờ, ăn nói sắc dễ thành thị phi.|Ở cung lục thân Cự Môn đều là ác diệu nên khó may mắn. Can Đinh làm Cự Môn hóa Kỵ thì cha mẹ hay cãi vã. Cổ xưa nên cho làm con nuôi để tránh hình thương.|Lao tâm bất an, tổn hao tâm sức là đặc điểm lớn nhất ở bất cứ cung nào. Đồng Thiên Đồng là tổ hợp tốt nhất, ít tốn công phiền muộn; gặp sát thì càng nặng nề.|Cự Môn trôi nổi nên không hợp Điền Trạch cần ổn định; gặp Hóa thì tài sản thay đổi mãi nhưng cuối cùng vẫn có riêng. Miếu vượng thì giàu, bất động sản tự có nhiều.|Miếu có nhiều cát tinh thủ chiếu thì có chức sắc, võ chức quyền quý, quan văn không lợi. Hãm thì buôn ba, bủn xỉn, mọi chuyện phí công. Miếu thì sự nghiệp dựa chủ yếu vào tài ăn nói, chuyên môn.|Miếu có cấp dưới thì ban đầu kém, về sau mới được việc. Hãm thì không thuộc hạ, hoặc người độc ác, quỷ quyệt, nhiều thị phi. Đồng Thiên Cơ thì thuộc hạ nhiều phiền phức.|Sợ nhất Thái Dương hóa Kỵ (can Giáp), nhất là Thái Dương miếu vượng: bị người oán hận hoặc dính thị phi. Ra ngoài vất vả, lao tâm lao lực, bất ổn, dễ bất hòa.|Âm thổ nên chủ bệnh tỳ, thấp khí, lở loét; chủ đường miệng nên bệnh hô hấp, dạ dày; ám tinh còn chỉ âm tổn, ám thương, bệnh phổi, ung thư dạ dày.|Do là ám diệu nên có thị phi, tranh giành đúng sai, tốn tâm sức. Giàu có nhờ trí tuệ, tài ăn nói, có thể tay trắng lập nghiệp; miếu vượng thì làm nên nhưng vì quá kiêu ngạo mà dễ hỏng việc.|Không may mắn, nên sinh con muộn; con trai cả thường khó nuôi. Thái Dương phải miếu mới hóa giải được bóng tối nhưng vẫn tổn hại con cả. Miếu thì có thể 2 con.|Đa phần không tốt: cổ nói chủ sinh ly tử biệt. Nam mệnh khắc vợ, tính cứng thì xung đột, vợ dễ vui với người khác; nữ mệnh cũng gặp trắc trở. Là hình tướng đào hoa không may.|Không may mắn: ít anh em, tính bình đạm, hay lo cho người khác nhưng thích phàn nàn, tình cảm lạnh nhạt, hẹp hòi, dễ chia rẽ. Miếu vượng có 2 anh em; hãm thì cùng cha khác mẹ, nên ở riêng.
Thiên Tướng|Mặt vuông hoặc hơi tròn, hàm rộng; da trẻ trắng xanh, già trắng vàng; trẻ rất xinh đẹp, già sắc diện kém dần. Miếu vượng cao trung bình, hãm thì gầy nhỏ, kén ăn. Tính ôn hòa, lời nói chân thành, sống nội tâm, trung thực, tốt bụng, giỏi giúp người.|Quan hệ sâu sắc với cha mẹ, nhận ân trạch lớn; cha mẹ sáng suốt, nhân cách cao, có thể có hai đời cha mẹ. Miếu vượng có nhiều cát tinh thì dù có hung tinh cũng ít tổn hại; hãm thêm sát tinh thì ân trạch giảm.|Chuộng thời trang, biết hài lòng, vui vẻ. Miếu vượng thì an nhàn hạnh phúc; Mệnh và Phúc Đức đều có cát tinh thì thọ trên 80 (tham khảo). Hãm thêm sát tinh thì vất vả, lao tâm khổ tứ.|Miếu thì có thể thừa kế nhiều tài sản tổ tiên; nhiều cát tinh chiếu thì nhận sớm hoặc tự gây dựng. Hãm thì vận điền trạch khó, đến trung niên và già mới tự mua được của cải.|Dù ở địa vị nào cũng không hợp đứng đỉnh cao nhất, nên giữ vai trò phụ trách công việc kẻo gặp thị phi và đả kích. Miếu thì mọi điều may mắn, nắm uy quyền văn võ, lương thảo đầy đủ.|Miếu vượng thì thuộc hạ và bạn bè đông, có thế lực, nhiều cát tinh càng đẹp. Hãm thì kém, có cũng như không. Đồng Tử Vi thì kết giao người thích tranh biện hoặc đấu tranh cho lẽ phải.|Gặp cách Hình Kỵ giáp Ấn thì tuyệt đối không nên rời quê đi xa; gặp cách Tài Ấm giáp Ấn thì nên tha hương lập nghiệp. Miếu vượng thì nhân duyên tốt, nổi tiếng, được nhiều người vây quanh.|Dương thủy nên chủ bệnh thận và hệ bài tiết. Miếu thì cả đời khỏe, chỉ có bệnh ngoài da nhẹ, khí huyết, vàng da; hãm thêm tứ sát không hóa giải thì dễ khuyết tật.|Miếu vượng thì tài bạch phú túc; hãm thì vất vả, tay trắng khởi gia. Thiên Tướng và Thiên Phủ một ở Tài Bạch, một ở Quan Lộc hợp chiếu Mệnh, Mệnh có Lộc Tồn, Khoa Quyền Lộc, Tả Hữu... thì là cách phú quý.|Quy tắc quan trọng: thấy sao phò tá tụ tập không sát tinh thì đông con; thiếu phò tá thì khó có con trai, có thể phải nhận con nuôi hoặc vợ lẽ sinh con trai trước rồi chính thất mới sinh được.|Cổ nhân nói thân thượng gia thân; thời nay chuyển hóa thành tình yêu giữa bạn học, đồng nghiệp hoặc người quen từ trước nhưng không có tình cảm, sau này mới nảy nở. Hôn nhân khá hòa thuận, hai bên hiểu nhau.|Anh em hòa thuận. Nhưng nếu Vũ Khúc và Thiên Tướng cùng cung, hoặc đối cung có Vũ Khúc, Phá Quân lại gặp Sát và Kỵ thì anh em bất hòa, xung khắc hoặc có người cùng cha khác mẹ.
Thiên Lương|Ngũ quan cân đối, vẻ thận trọng, sắc mặt trắng vàng, mặt thanh tú thuôn dài, mũi thẳng cao, đầu óc thông minh; thân hình thấp gầy hoặc cao gầy; ở Ngọ thường lùn và béo, ở Kỷ thường mảnh khảnh. Tính ôn hòa, chính trực, thích che chở người khác.|Là sao Thọ và Ám: cha mẹ khỏe mạnh, hoạt bát, có trách nhiệm, tử tế. Miếu vượng thì song thân vẹn toàn, phúc lộc trường thọ, thêm cát hóa cát diệu thì chắc chắn được che chở. Hãm hoặc bình thì cha mẹ có điều trắc trở.|Sao thanh quý nên coi trọng đời sống tinh thần, thích vui vẻ, an nhàn hưởng phúc, hay khuyên người khác, có trình độ văn học uyên thâm. Phúc lộc song toàn; Mệnh và cung này cùng tốt thì thọ cao.|Là sao che chở nên được thừa kế cơ nghiệp tổ tiên. Miếu thì thừa kế hoặc tự gây dựng, sở hữu bất động sản; hãm thì tài sản tổ tiên ít ỏi, không có phần. Thiên Lương hóa Quyền nhập cung này thì có thêm quyền chủ trong chuyện nhà đất.|Thiên Lương ở Ngọ thêm Tả Hữu, Khôi Việt hoặc Lộc Quyền Khoa thì giữ cương vị cao ngành văn hóa, quân sự; người bình thường cũng giàu. Vị trí cao chỉ là quan chức cấp cao, không phải quan chức cao nhất.|Miếu vượng thì nhiều thuộc hạ, bạn bè có năng lực; hãm thì có cũng như không, về già mới có bạn và cấp dưới giỏi. Lưu ý Thiên Lương là sao cô đơn nên cần thêm phò tá mới có người giúp.|Miếu gặp cát hóa và phò tá (không gặp Xương Khúc) thì làm thương gia giàu có ở xa quê; không hợp gặp Kình, Đà kẻo chỉ là thương gia bình thường. Miếu thì ra ngoài nhiều quý nhân.|Dương thổ nên chủ lá lách, dạ dày, tuyến vú. Miếu thì ít gặp điều không may, dù rối loạn đường ruột, tiêu hóa kém vẫn chuyển nguy thành lành; hãm thì bệnh dạ dày, tuyến vú dai dẳng.|Miếu vượng thì giàu, gặp cát tinh càng đẹp; hãm thì lao tâm khổ tứ để làm giàu. Thiên Lương không phải tài tinh, ở Tài Bạch thiên về quản lý tiền bạc hơn là kiếm tiền.|Vì tính cô khắc nên thường có con gái trước. Miếu vượng thì có hai con, con gái đầu lòng, con hiếu thuận xuất sắc. Gặp Tả Hữu, Xương Khúc thì có con trai với vợ lẽ; thêm tứ sát thì kém, gặp Không Kiếp thì khó con.|Người chưa trải tai họa, trắc trở mới nên duyên thì sau khi cưới nhất định có một thời gian sống xa nhau. Bạn đời thường lớn tuổi hơn từ 3 tuổi trở lên mới thuận.|Miếu thì anh em hòa thuận, 4-5 người. Hãm (ở Tỵ, Thân, Hợi) thì ít anh em, ly tán, không có người giúp, dễ tranh chấp; thêm Thiên Hình và sát tinh thì kiện tụng giữa anh em.
Thất Sát|Ngũ quan sắc nét, góc cạnh, mặt không mịn, thường dài gầy, ít mặt vuông, chiều cao trung bình; da trẻ trắng xanh, già vàng đỏ. Miếu thì béo, hãm thì gầy gò, có khuyết tật hoặc tê bì. Tính dũng mãnh, quyết đoán, độc lập, nóng và kiêu.|Đứng một mình thì có hình khắc, dù miếu vẫn phải xa cha mẹ từ thiếu niên; cha mẹ cố chấp, bảo thủ nên quan hệ thiếu hòa thuận. Miếu cũng chủ chết sớm hoặc sinh ly.|Miếu gặp sao cát thì phúc dày chí cao nhưng bất lợi cho vợ con, có hình khắc, thị phi, trì hoãn. Bận rộn là khó tránh, kể cả khi Mệnh tốt hội cát tinh cũng vất vả, lao tâm.|Miếu thì kế thừa tổ nghiệp, ở vượng địa thì tự mua được bất động sản; ở Tỵ, Hợi là bình thì gia sản tổ tông ít, không có phần. Không nên độc tọa, nếu không dù miếu gặp cát tinh cũng khó giữ.|Miếu có nhiều cát tinh: quân nhân giữ chức cao, công chức văn hóa thì bất lợi. Đắc hoặc bình thì chỉ là người bình thường. Hợp công an, quân đội và nghề đòi hỏi uy lực.|Đa phần không may, không tốt. Miếu có cát tinh thì nhiều bạn và cấp dưới nhưng không ai giúp, phải xem Hóa Lộc của sao khác ở đâu có hóa giải được không (Thất Sát không có tứ hóa riêng).|Thường ở ngoài dài ngày, tìm niềm vui trong bận rộn, có địa vị và quyền lực bên ngoài, được kính nể. Đại hạn hoặc lưu niên chạm cung này thì sự nghiệp thay đổi trong giai đoạn đó, tốt xấu tùy sao hội.|Âm kim nên dễ bệnh đường hô hấp (phổi thuộc kim); chủ đau đớn: hay bệnh nhiều thuở nhỏ, tính nóng, dễ cáu. Miếu thì nhẹ hơn.|Miếu thì kiếm tiền nơi ồn ào náo nhiệt; ở Tý, Ngọ, Dần, Thân (miếu vượng) gặp may và giàu bất ngờ nhưng lên xuống thất thường, được mất; tiền đến bất ngờ nhưng khó giữ.|Ít con. Dù miếu vượng có phò tá cát tinh vây quanh cũng chỉ một con, nên sinh con gái trước rồi con trai; con làm cho gia đình phú quý. Thêm hung sát thì không có gì.|Nói chung không tốt. Dù gia hội Lộc Tồn và cát hóa cũng chỉ là được vợ giúp, phải kết hôn muộn mới sống đến già, kết hôn sớm dễ khắc hại người bạn đời, tình cảm cuối cùng ghẻ lạnh.|Không thể chỉ dựa vào sao trong cung này để đoán số anh em mà phải xem sao ở cung Mệnh. Theo cách luận của phái Trung Châu, tùy sao ở Mệnh mà số anh em và mức hòa thuận thay đổi; Thất Sát đơn thường ít anh em, tính cách mạnh.
Phá Quân|Lông mày rậm, mắt to, miệng mũi rộng; ở vượng địa thân cao, hơi mập; da trẻ trắng xanh, già xanh vàng; hãm thì gầy cao, mặt rỗ hoặc phá tướng. Nữ mệnh mặt nhỏ tròn như Tham Lang nhưng cằm nhọn. Tính mạnh, thích cải cách, phá cũ lập mới, đời nhiều thăng trầm.|Ác diệu ở cung này: miếu gặp cát tinh dù không hình khắc vẫn phải sớm xa gia đình tự lập; hãm gặp sát Kỵ xung phá thì khó tránh hình khắc với cha mẹ. Đây là điềm không lành cho quan hệ với cha mẹ.|Mệnh đẹp thì thọ từ 57 trở lên (tham khảo). Miếu vượng thì giỏi quyết định và tự làm mọi việc nên chăm chỉ; hãm thì nhiều thành kiến, ít quyết đoán, mọi việc dù vất vả vẫn khó trọn vẹn.|Độc tọa, miếu thì biến việc cũ thành mới, phá trước thành sau; hãm thì tài sản đổ nát, nghề tổ tiên bị phá bại. Hay bán đi mua lại, khó giữ tổ nghiệp.|Có hai hướng nghề: binh nghiệp hoặc dựa vào tài nghệ làm giàu. Quy tắc: miếu, cung Quan Lộc không có Kình, Đà, Hỏa, Linh, Không, Kiếp đồng cung (tam phương có một hai sát tinh không sao) thì thành tựu tốt; hợp đổi mới, khởi nghiệp.|Độc tọa thì bị cô lập, thường không cát lợi vì thiếu chính tinh điều hòa; cổ nói chủ oán báng, người dưới bỏ trốn. Thời nay nếu miếu, can Quý làm Phá Quân hóa Lộc, thêm Tả Hữu, Khôi Việt thì có thể có thuộc hạ giúp sức.|Cổ nhân cho là không may, chạy vạy vô lực. Thực tế nếu không lạc hãm và không gặp Kình Đà tụ hội thì không nặng như vậy; ra ngoài thường được ngưỡng mộ về kỹ năng, nghệ thuật hoặc chuyên môn.|Từ nhỏ cơ thể yếu, nhiều vết thương do té ngã, họa máu mưng mủ hoặc phá tướng. Miếu vượng thì tai họa nhẹ nhưng từ nhỏ có lở loét, hô hấp kém, chú ý viêm phế quản, viêm phổi; hãm thì nặng hơn.|Ở Tý, Ngọ là miếu thì giàu có phú quý; ở Thìn, Tuất là vượng cũng giàu; các cung khác lạc hãm thì của cải dễ tán khó tụ. Ở Thìn, Tuất là cách thiên la địa võng nhập Tài Bạch nên cần xét thêm sao hội.|Không tốt cho con trưởng, nên sinh con gái trước. Miếu vượng có thể ba con; thêm sao ác chỉ một con, tinh lực kém, cha mẹ con không hòa thuận, có dấu hiệu bỏ nhà đi xa.|Đa phần không tốt, hay sống chung trước hôn nhân. Nam mệnh vợ hơn tuổi mới tốt; nữ mệnh chồng hơn nhiều tuổi mới tốt. Có hình khắc, phân ly hoặc có danh vợ chồng mà không có phận; kết hôn sớm càng bất lợi.|Miếu có ba anh em; hãm thêm sát thì là con một. Anh em bị chia cách hoặc hình khắc; phần lớn người này giữ vị trí như anh cả, dù là con thứ hai hay thứ ba.`.split('\n').map(l=>{const a=l.split('|');return[a[0],a.slice(1)]}));
function readingLong(){const S=window.LS,C=S.C,M=S.M,pp=x=>'<p>'+x+'</p>',cx=b=>md(b-M);
let h=`<h3>Luận giải chi tiết 12 cung số${S.name?' · '+S.name:''}</h3><p class='cg'>Lời giải từng chính tinh ở từng cung, tổng hợp từ sách Tử Vi Nam Phái (Tam Hợp) và được diễn đạt lại; chỉ mang tính tham khảo, cần xét thêm tam phương tứ chính và vận hạn.</p><div class='toc'>${CUNG.map((n,i)=>`<button data-r='${i}'>${n}</button>`).join('')}</div>`;
for(let ci=0;ci<12;ci++){const b=md(M+ci),c=C[b],mj=c.s.filter(x=>x.mj==1),o=md(b+6);
h+=`<h3 id='r${ci}' class='s'>${ci+1}. Cung ${CUNG[ci]} <small>${CAN[S.canAt(b)]} ${CHI[b]}${b==S.Th?' · cung Thân':''}</small></h3>`;
const ent=x=>`<div class='it'><b class='${x.e}'>${x.n}</b>${x.br?` <i class='bd bg${BCL[x.br]}'>${BRN[x.br]}</i>`:''}<p>${LT[x.n]?LT[x.n][ci]:''}</p></div>`;
if(mj.length)h+=(mj.length>1?pp(`Cung có ${mj.length} chính tinh đồng cung (${mj.map(x=>x.n).join(', ')}). Mỗi sao được luận riêng bên dưới, nên đọc hòa trộn cả bộ.`):'')+mj.map(ent).join('');
else{const os=C[o].s.filter(x=>x.mj==1);h+=pp(`Cung ${CUNG[ci]} vô chính diệu, mượn chính tinh ở đối cung ${CUNG[cx(o)]}${os.length?' ('+os.map(x=>x.n).join(', ')+'), lực nhẹ hơn chính tinh tọa thủ, rồi xét thêm phụ tinh trong cung':', nên chủ yếu xét phụ tinh và tam phương'}.`)+os.map(ent).join('')}
const ot=c.s.filter(x=>x.mj!=1&&!/^[LP]\./.test(x.n)&&(GM.has(x.n)||GN.has(x.n)||BM.has(x.n)||BN.has(x.n)));
if(ot.length)h+=pp('<b>Phụ tinh trong cung</b>: '+ot.map(x=>`<b class='${x.e}'>${x.n}</b>`).join(', ')+' (chạm vào cung trên lá số để xem ý nghĩa từng sao).');
const tu=S.tu.includes(b),tr=S.tr.includes(b);if(tu||tr)h+=pp((tu?'<b class="W">Tuần</b> ':'')+(tr?'<b class="K">Triệt</b> ':'')+'đồng cung làm giảm hoặc đổi hướng lực các sao ở trên.')}
h+=`<p class='nt'>Nội dung được rút ý và viết lại từ sách, không phải bản trích nguyên văn; kết quả mang tính tham khảo.</p><p class='ct'>Luận giải chi tiết, liên hệ: <a href='tel:0794353630'>☎ 079 43 53 630</a></p>`;return h}
function showLong(){const h=readingLong();if(!$('pn').classList.contains('on'))window.ps={y:scrollY,x:$('out').scrollLeft};$('pc').innerHTML=h;$('pn').classList.add('on');document.documentElement.classList.add('lock');$('pn').querySelector('.pb').scrollTop=0}
$('out').addEventListener('click',e=>{if(e.target.id=='rd2')showLong()});
$("go").onclick=run;
(()=>{let s='<svg viewBox="-200 -200 400 400" fill="none" stroke="#e8c46a" stroke-width="3"><circle r="196"/><circle r="108" stroke-width="1.5"/><circle r="64" fill="#e8c46a" fill-opacity=".25"/><path d="M0-64A32 32 0 0 1 0 0A32 32 0 0 0 0 64A64 64 0 0 1 0-64" fill="#e8c46a" fill-opacity=".5"/>';[7,3,5,1,6,2,4,0].forEach((t,i)=>{s+=`<g transform="rotate(${i*45})">`;for(let j=0;j<3;j++){const y=-135-j*17;s+=(t>>j)&1?`<path d="M-26 ${y}H26"/>`:`<path d="M-26 ${y}H-6M6 ${y}H26"/>`}s+="</g>"});$("bg").innerHTML=s+"</svg>"})();
</script></body></html>
